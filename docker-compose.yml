version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      - RAILS_ENV=development
      - AI_INTERVIEW_TEST_MODE=true
    env_file:
      - .env
    stdin_open: true
    tty: true

volumes:
  bundle_cache:
