<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サーバーエラー - WJrk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f4ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container { text-align: center; padding: 2rem; max-width: 500px; }
    .logo { font-size: 2rem; font-weight: 700; color: #1a56db; margin-bottom: 1.5rem; letter-spacing: 0.05em; }
    .error-code { font-size: 6rem; font-weight: 800; color: #dc2626; line-height: 1; margin-bottom: 0.5rem; }
    .error-title { font-size: 1.5rem; font-weight: 600; color: #1e3a5f; margin-bottom: 1rem; }
    .error-message { font-size: 1rem; color: #64748b; margin-bottom: 2rem; line-height: 1.6; }
    .back-link { display: inline-block; padding: 0.75rem 2rem; background: #1a56db; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
    .back-link:hover { background: #1445b5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">WJrk</div>
    <div class="error-code">500</div>
    <div class="error-title">サーバーエラー</div>
    <p class="error-message">申し訳ございません。サーバーで問題が発生しました。<br>しばらく時間をおいて再度お試しください。</p>
    <a href="/" class="back-link">トップページへ戻る</a>
  </div>
</body>
</html>
